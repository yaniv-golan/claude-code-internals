# Targeted: B10 search -> xref -> fetch procedure
# Checks: multi-subsystem query consults cross-references (xref.js or cross-references.json); lesson content fetched
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t20-procedure-xref
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: how do hooks and the permission system interact - can a hook''s allow decision override a deny rule in settings?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - reference_read: 'scripts/xref\.js|references/cross-references\.json'
  - reference_read: 'scripts/fetch-lesson\.js|references/\d\d-[a-z0-9.-]+\.md'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev)'
