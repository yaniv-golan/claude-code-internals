# CONTAINER-tier copy of t02-state-first-folded-command: same prompt, session and assertions; only fidelity differs.
# At container the plugin is staged inside the sandbox, so the fork's `node ${CLAUDE_SKILL_DIR}/scripts/...`
# resolves and runs: this copy measures the SCRIPT path. t02-state-first-folded-command (hostloop) measures the local lane
# and the offline Read/Grep fallback. Keep the two in sync.
# Targeted: B1 state-layer-first precedence
# Checks: as t01; answer names /usage
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: c02-state-first-folded-command
session: ../sessions/hostloop-sonnet5.yaml
fidelity: container
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: does the /cost command still exist in Claude Code today? What should I type instead?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - reference_read: 'scripts/state\.js|references/state/'
  - tool_result_matches: 'completed \(forked execution\)[\s\S]*(/usage)'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev)'
