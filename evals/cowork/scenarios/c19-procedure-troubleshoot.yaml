# CONTAINER-tier copy of t19-procedure-troubleshoot: same prompt, session and assertions; only fidelity differs.
# At container the plugin is staged inside the sandbox, so the fork's `node ${CLAUDE_SKILL_DIR}/scripts/...`
# resolves and runs: this copy measures the SCRIPT path. t19-procedure-troubleshoot (hostloop) measures the local lane
# and the offline Read/Grep fallback. Keep the two in sync.
# Targeted: B10 search -> troubleshoot -> fetch procedure
# Checks: problem query consults the troubleshooting index (troubleshoot.js or troubleshooting.json); lesson content fetched (fetch-lesson.js or a lesson file)
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: c19-procedure-troubleshoot
session: ../sessions/hostloop-sonnet5.yaml
fidelity: container
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: my PreToolUse hook doesn''t seem to fire when Claude runs a Bash command I''ve already allowlisted. Why is it not working?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - reference_read: 'scripts/troubleshoot\.js|references/troubleshooting\.json'
  - reference_read: 'scripts/fetch-lesson\.js|references/\d\d-[a-z0-9.-]+\.md'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev)'
