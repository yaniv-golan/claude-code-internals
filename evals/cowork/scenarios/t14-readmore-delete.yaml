# Targeted: B7 Read more return contract
# Checks: as t13
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t14-readmore-delete
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: my Cowork skill''s cleanup step runs rm on a temp file in the outputs folder and gets ''Operation not permitted''. Why, and what should the skill do instead?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - tool_result_matches: 'completed \(forked execution\)[\s\S]*(Read more:\s*<?https://ccinternals\.dev/cowork/[a-z-]*/?\?ref=skill)'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev/(?![^\s)\]>]*\?ref=skill)[^\s)\]>]*)'
  - transcript_matches: 'https://ccinternals\.dev/cowork/[a-z-]*/?\?ref=skill'
  - transcript_not_matches: 'ccinternals\.dev/(?![^\s)\]>]*\?ref=skill)[^\s)\]>]*'
