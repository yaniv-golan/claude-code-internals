# Targeted: B6 answer-size limit (<5KB, or ask when >3 lessons)
# Checks: the skill's return stays under 5 KB (+ ~280-char wrapper); relay under 7000 chars; exact lengths recorded by run-suite.js
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t11-size-broad-permissions
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: explain everything about Claude Code''s permission system end to end: every mode, every rule source, hooks, sandboxing, and how Cowork changes it.'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]{5400}'
  - transcript_not_matches: '[\s\S]{7000}'
  - allow_stall: true
