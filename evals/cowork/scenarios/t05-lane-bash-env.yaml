# Targeted: B3 lane qualification
# Checks: the skill's answer names the Cowork execution lane (host-loop / VM / local / cloud); relay checked separately
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t05-lane-bash-env
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: in Claude Cowork, where does my skill''s bash command actually run, and will it see the environment variables I set in my settings?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - tool_result_matches: 'completed \(forked execution\)[\s\S]*(host[- ]?loop|vm[- ]?loop|cloud|remote|local lane|on (your|the user''s) computer)'
  - transcript_matches: 'host[- ]?loop|vm[- ]?loop|cloud|remote|local lane|on (your|the user''s) computer'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev/(?![^\s)\]>]*\?ref=skill)[^\s)\]>]*)'
