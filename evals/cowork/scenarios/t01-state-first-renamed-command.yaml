# Targeted: B1 state-layer-first precedence
# Checks: state layer accessed (state.js or references/state/); the skill's answer names the rename target. ORDER (state before search/lessons) is derived post-hoc by run-suite.js from the trace
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t01-state-first-renamed-command
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: is /toggle-memory still a working slash command in the current Claude Code, and if not what replaced it?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - reference_read: 'scripts/state\.js|references/state/'
  - tool_result_matches: 'completed \(forked execution\)[\s\S]*(pause-memory)'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev)'
