# Targeted: B8 offline Read/Grep fallback
# Checks: user states scripts can't run; the answer comes from reference files via Read/Grep
# 'completed \(forked execution\)' anchors a regex on the skill's OWN return (the Skill tool_result;
# the skill is context: fork), not on the parent's relay or a nested sub-agent's result.
name: t16-offline-user-says-no-node
session: ../sessions/hostloop-sonnet5.yaml
fidelity: hostloop
on_unanswered: fail
timeout_ms: 900000
prompt: 'Using the claude-code-internals skill: node and bash don''t work in my environment, so don''t run any scripts - read the skill''s reference files directly. What replaced the /cost command?'
assert:
  - skill_triggered: 'claude-code-internals'
  - tool_no_error: '.*'
  - max_tool_errors: 0
  - reference_read: 'references/'
  - tool_result_matches: 'completed \(forked execution\)[\s\S]*(/usage)'
  - tool_result_not_matches: 'completed \(forked execution\)[\s\S]*(ccinternals\.dev)'
