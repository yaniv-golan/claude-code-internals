name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  state-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script tests
        run: node --test 'skill-package/skills/claude-code-internals/scripts/tests/*.test.js'
      - name: State-layer integrity
        run: node skill-package/skills/claude-code-internals/scripts/validate-state.js
      - name: State-layer reconciliation
        run: |
          out=$(node skill-package/skills/claude-code-internals/scripts/state.js --audit)
          echo "$out"
          echo "$out" | grep -q "everything reconciled to baseline"
      # Build the public site at PR time, not only at deploy. Without this a
      # template edit or a broken cross-link passes review and turns main red.
      - name: Site generator tests
        run: node --test 'site/generator/tests/*.test.js'
      - name: Site build (no deploy)
        run: node site/generator/build.js --out "$RUNNER_TEMP/site-dist"
      - name: Disclosure lint over built output
        run: node site/generator/lint-disclosure.js "$RUNNER_TEMP/site-dist"
