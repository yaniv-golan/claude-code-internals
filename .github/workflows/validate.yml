name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  state-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Script tests
        run: node --test 'skill-package/skills/claude-code-internals/scripts/tests/*.test.js'
      - name: JSON index format
        run: node skill-package/skills/claude-code-internals/scripts/check-json-format.js
      # Lesson bounds and lesson/chapter counts are derived from the reference
      # files; fail if any is stale, or if topic-index.json's keyword fields are
      # not what prepare-lessons.js derives (the frozen hand-keywords.json
      # projected onto the live lessons, plus keys derived from the lesson text),
      # hand-keywords.json was edited, or the unreachable count rose.
      - name: Derived fields
        run: node skill-package/skills/claude-code-internals/scripts/build.js --check
      # Retrieval quality gate: the generated question set (evals/retrieval/)
      # scored against the recorded baseline. Fails on a per-stratum MRR/nDCG
      # drop, any identifier question losing top-1, or any single question
      # losing more than a few ranks (thresholds are stored in the baseline).
      # The question set is named explicitly: a questions-vN.json is only ever
      # scored against its own baseline. v2 carries acceptable-answer sets
      # (evals/retrieval/gen-relevance.js): a question's rank is its first
      # acceptable lesson's. baseline-v3 scores questions-v2 under the split
      # rule (every lesson a hard ranking test asserts is dev); baseline-v2
      # (the split before it) and questions-v1/baseline-v1 stay in the repo for
      # trend and are not gated.
      - name: Retrieval baseline
        run: node evals/retrieval/run.js --baseline evals/retrieval/baseline-v3.json --questions evals/retrieval/questions-v2.json
      - name: State-layer integrity
        run: node skill-package/skills/claude-code-internals/scripts/validate-state.js
      - name: State-layer reconciliation
        run: |
          out=$(node skill-package/skills/claude-code-internals/scripts/state.js --audit)
          echo "$out"
          echo "$out" | grep -q "everything reconciled to baseline"
      # Build the public site at PR time, not only at deploy. Without this a
      # template edit or a broken cross-link passes review and turns main red.
      - name: Site generator tests
        run: node --test 'site/generator/tests/*.test.js'
      - name: Site build (no deploy)
        run: node site/generator/build.js --out "$RUNNER_TEMP/site-dist"
      - name: Disclosure lint over built output
        run: node site/generator/lint-disclosure.js "$RUNNER_TEMP/site-dist"
